spring:
  application:
    name: currency-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/currency}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

rates:
  provider-url: https://open.er-api.com/v6/latest/USD
  connect-timeout: 3s
  read-timeout: 5s
  zone: Asia/Almaty
